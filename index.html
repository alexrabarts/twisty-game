<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twisty Challenge Tour</title>
    <style>
        /* ============ Design tokens ============ */
        :root {
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --font-digits: "SF Mono", "Menlo", "Consolas", "Courier New", monospace;
            --radius-panel: 14px;
            --radius-control: 8px;
            --panel-bg: rgba(8, 12, 18, 0.55);
            --panel-border: rgba(255, 255, 255, 0.12);
            --accent-blue: #4a9eff;
            --accent-blue-soft: rgba(74, 158, 255, 0.35);
            --accent-green: #2bff7e;
            --accent-gold: #ffd700;
        }

        .wheelie-indicator {
            position: absolute;
            bottom: 200px;
            left: 50%;
            transform: translateX(-50%);
            font-family: var(--font-ui);
            font-size: 32px;
            font-weight: 800;
            font-style: italic;
            letter-spacing: 1px;
            text-align: center;
            display: none;
            padding: 10px 24px;
            border-radius: var(--radius-panel);
            border: 1px solid rgba(255, 255, 255, 0.15);
            animation: pulse 0.5s infinite;
        }

        .wheelie-indicator.active {
            display: block;
        }

        .wheelie-indicator.perfect {
            color: #FFD700;
            background: rgba(80, 60, 0, 0.45);
            border-color: rgba(255, 215, 0, 0.5);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.25);
        }

        .wheelie-indicator.good {
            color: #00FF00;
            background: rgba(0, 70, 20, 0.45);
            border-color: rgba(0, 255, 0, 0.45);
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.8);
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.2);
        }

        .wheelie-indicator.danger {
            color: #FF3333;
            background: rgba(80, 0, 0, 0.5);
            border-color: rgba(255, 0, 0, 0.55);
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.3);
            animation: flash 0.3s infinite;
        }

        .wheelie-indicator.low {
            color: #FFAA00;
            background: rgba(80, 50, 0, 0.45);
            border-color: rgba(255, 170, 0, 0.5);
            text-shadow: 0 0 20px rgba(255, 170, 0, 0.8);
            box-shadow: 0 0 25px rgba(255, 170, 0, 0.2);
        }

        @keyframes pulse {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.05); }
            100% { transform: translateX(-50%) scale(1); }
        }

        @keyframes flash {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .wheelie-combo {
            font-size: 18px;
            font-weight: 700;
            font-style: normal;
            color: #FFD700;
            margin-top: 5px;
        }

        /* Speed vignette - tunnel vision effect at high speeds */
        #speedVignette {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            box-shadow: inset 0 0 250px rgba(0, 0, 0, 0.8);
            opacity: 0;
            transition: opacity 0.2s ease-out;
            z-index: 50;
        }


        body {
            margin: 0;
            padding: 0;
            background: #14181f;
            font-family: var(--font-ui);
            overflow: hidden;
        }
        canvas {
            display: block;
        }
        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 14px;
            z-index: 100;
        }

        /* FPS counter - tucked into the top-right corner */
        .info {
            position: absolute;
            top: 10px;
            right: 12px;
            z-index: 100;
            font-family: var(--font-digits);
        }

        /* Score display - prominent at top */
        .score-display {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            z-index: 100;
            padding: 8px 28px 12px;
            background: linear-gradient(180deg, rgba(8, 12, 18, 0.5) 0%, rgba(8, 12, 18, 0.25) 100%);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-panel);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
        }

        #score {
            font-size: 46px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: var(--accent-gold);
            text-shadow:
                0 2px 4px rgba(0, 0, 0, 0.8),
                0 0 22px rgba(255, 215, 0, 0.35);
            margin: 0;
            line-height: 1.05;
            letter-spacing: 1px;
        }

        #scoreLabel {
            font-size: 12px;
            font-weight: 700;
            color: rgba(255, 215, 0, 0.75);
            letter-spacing: 4px;
            margin: 0 0 2px;
        }

        #comboDisplay {
            font-size: 20px;
            font-weight: 700;
            color: #FF69B4;
            text-shadow: 0 0 14px rgba(255, 105, 180, 0.6);
            margin-top: 4px;
            animation: pulse-combo 0.5s ease-in-out;
        }

        @keyframes pulse-combo {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* Digital LED Speedometer */
        .speedometer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }

        .speedo-ring {
            width: 200px;
            height: 80px;
            background: linear-gradient(160deg, rgba(20, 26, 24, 0.92) 0%, rgba(4, 8, 6, 0.95) 55%, rgba(14, 20, 17, 0.92) 100%);
            border: 1px solid rgba(43, 255, 126, 0.25);
            border-radius: var(--radius-panel);
            box-shadow:
                0 0 24px rgba(0, 255, 100, 0.18),
                0 6px 18px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                inset 0 0 14px rgba(0, 0, 0, 0.8);
            position: relative;
            padding: 10px;
        }

        .speedo-face {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 15px;
        }

        .speedo-value {
            font-size: 44px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: #00FF66;
            text-shadow:
                0 0 5px rgba(0, 255, 100, 0.9),
                0 0 12px rgba(0, 255, 100, 0.55),
                0 0 22px rgba(0, 255, 100, 0.3);
            font-family: var(--font-digits);
            margin: 0;
            line-height: 1;
            letter-spacing: 2px;
        }

        .speedo-unit {
            font-size: 13px;
            color: #00CC55;
            text-shadow: 0 0 8px rgba(0, 200, 90, 0.6);
            font-weight: 700;
            letter-spacing: 2px;
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }

        .speedo-label {
            font-size: 10px;
            color: #667;
            letter-spacing: 2px;
        }

        .position-indicator {
            position: absolute;
            top: 120px;
            right: 20px;
            background: var(--panel-bg);
            border: 1px solid rgba(0, 255, 100, 0.4);
            border-radius: var(--radius-panel);
            box-shadow:
                0 0 18px rgba(0, 255, 100, 0.12),
                0 6px 18px rgba(0, 0, 0, 0.4);
            padding: 15px;
            color: white;
            font-family: var(--font-digits);
            z-index: 100;
            min-width: 180px;
        }

        .position-indicator h3 {
            margin: 0 0 10px 0;
            color: var(--accent-green);
            font-size: 13px;
            letter-spacing: 2px;
            text-align: center;
        }

        .position-value {
            font-size: 36px;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            color: var(--accent-green);
            text-align: center;
            margin: 5px 0;
            text-shadow: 0 0 12px rgba(0, 255, 100, 0.5);
        }

        .position-suffix {
            font-size: 16px;
            color: #88ff88;
        }

        .total-racers {
            text-align: center;
            color: #aaa;
            font-size: 12px;
        }

        /* Tour Selector Overlay */
        .tour-selector-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 50% 30%, rgba(16, 26, 44, 0.96) 0%, rgba(2, 4, 8, 0.98) 75%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .tour-selector-panel {
            max-width: 1200px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 40px;
            background: linear-gradient(150deg, rgba(26, 30, 50, 0.85) 0%, rgba(18, 26, 48, 0.9) 100%);
            border: 1px solid rgba(74, 158, 255, 0.55);
            border-radius: 20px;
            box-shadow:
                0 0 60px rgba(74, 158, 255, 0.25),
                0 24px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            /* No backdrop-filter here: the panel is large and the canvas
               renders beneath it, so blur would cost every frame on mobile */
        }

        .tour-title {
            text-align: center;
            font-size: 48px;
            font-weight: 800;
            font-style: italic;
            color: #eaf4ff;
            margin: 0 0 12px 0;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow:
                0 0 24px rgba(74, 158, 255, 0.8),
                0 4px 12px rgba(0, 0, 0, 0.6);
        }

        .tour-subtitle {
            text-align: center;
            font-size: 18px;
            color: #88ccff;
            margin: 0 0 36px 0;
            font-weight: normal;
            letter-spacing: 1px;
        }

        .leg-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .leg-card {
            background: rgba(6, 10, 20, 0.65);
            border: 1px solid var(--accent-blue-soft);
            border-radius: var(--radius-panel);
            padding: 20px;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, background-color 0.25s ease;
            cursor: pointer;
        }

        .leg-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(74, 158, 255, 0.3);
            border-color: var(--accent-blue);
            background: rgba(12, 22, 42, 0.75);
        }

        .leg-card.selected {
            transform: translateY(-5px);
            box-shadow: 0 14px 36px rgba(0, 255, 100, 0.35);
            border-color: var(--accent-green);
            background: rgba(4, 32, 18, 0.72);
        }

        /* While the menu is up, hide the in-game HUD (it bleeds through the
           transparent showcase overlay) */
        body.in-menu .score-display,
        body.in-menu .info,
        body.in-menu .speedometer,
        body.in-menu .wheelie-indicator,
        body.in-menu #speedVignette,
        body.in-menu #speedBlurOverlay,
        body.in-menu .virtual-controls-left,
        body.in-menu .virtual-controls-right,
        body.in-menu .virtual-button-camera,
        body.in-menu .virtual-controls-instructions {
            display: none !important;
        }

        /* Showcase mode: the menu floats over a live 3D backdrop, so the
           overlay/panel go transparent and content pins top and bottom */
        .tour-selector-overlay.showcase-mode {
            background: none;
            pointer-events: none;
        }

        .tour-selector-panel.showcase-panel {
            background: none;
            border: none;
            box-shadow: none;
            max-width: 100%;
            width: 100%;
            height: 100%;
            max-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 28px 40px 32px;
            pointer-events: none;
        }

        .showcase-panel .tour-title {
            text-shadow: 0 2px 18px rgba(0, 0, 0, 0.9), 0 0 30px rgba(74, 158, 255, 0.5);
        }

        .showcase-panel .character-select-screen,
        .showcase-panel .track-select-screen {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        .showcase-spacer {
            flex: 1;
        }

        .showcase-label {
            text-align: center;
            color: #aaccee;
            letter-spacing: 3px;
            font-size: 13px;
            margin-bottom: 8px;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9);
        }

        .showcase-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 22px;
            pointer-events: none;
        }

        .carousel-arrow {
            pointer-events: auto;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            border: 2px solid rgba(120, 160, 220, 0.6);
            background: rgba(8, 14, 26, 0.75);
            color: #cde;
            font-size: 30px;
            line-height: 1;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .carousel-arrow:hover {
            transform: scale(1.1);
            border-color: var(--accent-blue);
        }

        .carousel-back {
            pointer-events: auto;
            padding: 6px 14px;
            background: rgba(8, 14, 26, 0.75);
            border: 1px solid rgba(120, 140, 200, 0.5);
            border-radius: 8px;
            color: #aac;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .showcase-info {
            pointer-events: auto;
            min-width: 320px;
            max-width: 420px;
            background: rgba(6, 10, 20, 0.82);
            border: 1px solid rgba(120, 160, 220, 0.45);
            border-radius: 14px;
            padding: 16px 24px;
            text-align: center;
            color: #aab;
            font-size: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
        }

        .showcase-name {
            color: white;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .showcase-sub {
            color: #8899bb;
            font-size: 13px;
            margin-top: 2px;
        }

        .showcase-hint {
            color: #cc8833;
            font-size: 12px;
            margin-top: 8px;
        }

        .showcase-stats {
            margin-top: 10px;
            text-align: left;
            display: inline-block;
            font-family: var(--font-mono, monospace);
            line-height: 1.6;
        }

        .stat-on { color: #ffd700; letter-spacing: 1px; }
        .stat-off { color: #334; letter-spacing: 1px; }

        .showcase-continue {
            pointer-events: auto;
            padding: 13px 56px;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(46, 204, 113, 0.4);
        }

        .showcase-continue:disabled {
            background: #2a3142;
            color: #667;
            cursor: not-allowed;
            box-shadow: none;
        }

        .showcase-secondary {
            pointer-events: auto;
            margin-left: 12px;
            padding: 13px 22px;
            background: rgba(255, 215, 0, 0.12);
            border: 1px solid rgba(255, 215, 0, 0.45);
            border-radius: 10px;
            color: #ffd700;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .rider-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .rider-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 22px rgba(74, 158, 255, 0.3);
            border-color: var(--accent-blue) !important;
        }

        .rider-card.selected {
            transform: translateY(-3px);
            box-shadow: 0 10px 26px rgba(255, 215, 0, 0.35);
            border-color: #ffd700 !important;
            background: rgba(40, 32, 8, 0.85) !important;
        }

        .leg-number {
            font-size: 11px;
            font-weight: 700;
            color: #88ccff;
            letter-spacing: 3px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .leg-name {
            font-size: 24px;
            font-weight: 700;
            color: #dcecff;
            margin: 0 0 10px 0;
            letter-spacing: 0.5px;
        }

        .leg-description {
            color: #9fb2c8;
            font-size: 14px;
            line-height: 1.6;
            margin: 0 0 15px 0;
            min-height: 60px;
        }

        .leg-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 12px;
            color: #8294aa;
        }

        .leg-stats .stat {
            display: flex;
            flex-direction: column;
        }

        .leg-stats strong {
            color: var(--accent-blue);
            margin-bottom: 2px;
        }

        .select-leg-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(160deg, #4a9eff 0%, #2266cc 100%);
            border: none;
            border-radius: var(--radius-control);
            color: white;
            font-family: var(--font-ui);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.25s ease, transform 0.15s ease, box-shadow 0.25s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 4px 14px rgba(34, 102, 204, 0.4);
        }

        .select-leg-btn:hover {
            background: linear-gradient(160deg, #34d36c 0%, #119944 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(20, 200, 90, 0.4);
        }

        .select-leg-btn:active {
            transform: translateY(0);
        }

        /* Leaderboard Entry Overlay */
        .leaderboard-entry-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 50% 30%, rgba(16, 26, 44, 0.96) 0%, rgba(2, 4, 8, 0.98) 75%);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .leaderboard-entry-overlay.active {
            display: flex;
        }

        .leaderboard-entry-panel {
            max-width: 500px;
            width: 90%;
            padding: 40px;
            background: linear-gradient(150deg, rgba(26, 30, 50, 0.85) 0%, rgba(18, 26, 48, 0.9) 100%);
            border: 1px solid rgba(74, 158, 255, 0.55);
            border-radius: 20px;
            box-shadow:
                0 0 60px rgba(74, 158, 255, 0.25),
                0 24px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            text-align: center;
        }

        .leaderboard-entry-title {
            font-size: 36px;
            font-weight: 800;
            font-style: italic;
            color: #eaf4ff;
            margin: 0 0 20px 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow:
                0 0 24px rgba(74, 158, 255, 0.8),
                0 4px 12px rgba(0, 0, 0, 0.6);
        }

        .leaderboard-entry-subtitle {
            font-size: 16px;
            color: #88ccff;
            margin: 0 0 30px 0;
        }

        .leaderboard-name-input {
            width: 200px;
            padding: 15px;
            font-size: 32px;
            text-align: center;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid var(--accent-blue-soft);
            border-radius: var(--radius-panel);
            color: #fff;
            font-family: var(--font-digits);
            letter-spacing: 8px;
            text-transform: uppercase;
            margin: 0 auto 30px;
            display: block;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .leaderboard-name-input:focus {
            outline: none;
            border-color: var(--accent-green);
            box-shadow: 0 0 20px rgba(0, 255, 100, 0.35);
        }

        .leaderboard-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .leaderboard-submit-btn,
        .leaderboard-cancel-btn {
            padding: 12px 30px;
            font-family: var(--font-ui);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.25s ease, transform 0.15s ease, box-shadow 0.25s ease, opacity 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: var(--radius-control);
            border: none;
            color: white;
        }

        .leaderboard-submit-btn {
            background: linear-gradient(160deg, #4a9eff 0%, #2266cc 100%);
            box-shadow: 0 4px 14px rgba(34, 102, 204, 0.4);
        }

        .leaderboard-submit-btn:hover:not(:disabled) {
            background: linear-gradient(160deg, #34d36c 0%, #119944 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(20, 200, 90, 0.4);
        }

        .leaderboard-submit-btn:disabled {
            background: linear-gradient(160deg, #555 0%, #333 100%);
            cursor: not-allowed;
            opacity: 0.5;
            box-shadow: none;
        }

        .leaderboard-cancel-btn {
            background: linear-gradient(160deg, #5a6270 0%, #3a4250 100%);
        }

        .leaderboard-cancel-btn:hover {
            background: linear-gradient(160deg, #ff4444 0%, #cc2222 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(204, 34, 34, 0.35);
        }

        .leaderboard-result-message {
            font-size: 24px;
            color: var(--accent-green);
            margin: 20px 0;
            text-shadow: 0 0 20px rgba(0, 255, 100, 0.7);
        }

        .leaderboard-result-rank {
            font-size: 48px;
            color: var(--accent-gold);
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            margin: 10px 0;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
        }

        .leaderboard-result-flagged {
            font-size: 14px;
            color: #ff9900;
            margin: 10px 0;
        }

        .leaderboard-error-message {
            font-size: 18px;
            color: #ff4444;
            margin: 20px 0;
        }

    </style>
</head>
<body>
    <!-- Simplified controls hint - mobile controls provide the actual interface -->
    <div class="controls">
    </div>
    
    <!-- Score Display -->
    <div class="score-display">
        <p id="scoreLabel">SCORE</p>
        <p id="score">0</p>
        <div id="comboDisplay"></div>
    </div>
    
    <!-- Top right info -->
    <div class="info">
        <div id="fps" style="font-size: 10px; color: #666;">FPS: 0</div>
    </div>
    
    <!-- Wheelie Indicator -->
    <div id="wheelieIndicator" class="wheelie-indicator">
        <div id="wheelieZone">WHEELIE!</div>
        <div id="wheelieCombo" class="wheelie-combo"></div>
    </div>

    <!-- Speed Vignette - darkens edges at high speed -->
    <div id="speedVignette"></div>

    <!-- Motorcycle Speedometer -->
    <div class="speedometer">
        <div class="speedo-ring">
            <div class="speedo-face">
                <div id="speed" class="speedo-value">0</div>
                <div class="speedo-unit">MPH</div>
            </div>
        </div>
    </div>

    <!-- Leaderboard Entry Overlay -->
    <div id="leaderboardEntryOverlay" class="leaderboard-entry-overlay">
        <div class="leaderboard-entry-panel">
            <h1 class="leaderboard-entry-title">LEADERBOARD</h1>

            <!-- Name entry screen -->
            <div id="leaderboardEntryForm">
                <p class="leaderboard-entry-subtitle">Enter your name (4 letters)</p>
                <input
                    type="text"
                    id="leaderboardNameInput"
                    class="leaderboard-name-input"
                    maxlength="4"
                    autocomplete="off"
                    placeholder="____"
                />
                <div class="leaderboard-buttons">
                    <button id="leaderboardSubmitBtn" class="leaderboard-submit-btn" disabled>Submit</button>
                    <button id="leaderboardCancelBtn" class="leaderboard-cancel-btn">Cancel</button>
                </div>
            </div>

            <!-- Result screen -->
            <div id="leaderboardResult" style="display: none;">
                <p class="leaderboard-result-message">Submitted!</p>
                <div id="leaderboardRankDisplay"></div>
                <div id="leaderboardFlaggedDisplay"></div>
                <div class="leaderboard-buttons" style="margin-top: 30px;">
                    <button id="leaderboardCloseBtn" class="leaderboard-submit-btn">Close</button>
                </div>
            </div>

            <!-- Error screen -->
            <div id="leaderboardError" style="display: none;">
                <p class="leaderboard-error-message" id="leaderboardErrorMessage"></p>
                <div class="leaderboard-buttons" style="margin-top: 30px;">
                    <button id="leaderboardErrorCloseBtn" class="leaderboard-cancel-btn">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>
    <script>
        // Wait for THREE.js to load before loading game scripts
        if (typeof THREE === 'undefined') {
            console.error('THREE.js failed to load');
            alert('THREE.js failed to load. Please refresh the page.');
        } else {
            console.log('THREE.js loaded successfully, version:', THREE.REVISION);
        }
    </script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js"></script>

    <!-- Firebase Config and Leaderboard -->
    <script src="js/firebase-config.js"></script>
    <script src="js/leaderboard.js"></script>

    <!-- Game Scripts -->
    <script src="js/virtualcontrols.js"></script>
    <script src="js/input.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/tours.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/vehicle.js"></script>
    <script src="js/environment.js"></script>
    <script src="js/cones.js"></script>
    <script src="js/rockfalls.js"></script>
    <script src="js/traffic.js"></script>
    <script src="js/main.js"></script>
</body>
